# ==============================================================================
# Webserver Default Configuration
# ==============================================================================

# Servidor 1: Porta principal 8080
server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost;

    root ./www;
    index index.html;
    client_max_body_size 10M;

    error_page 404 /404.html;
    error_page 500 /500.html;

    location / {
        allow_methods GET POST DELETE;
        autoindex on;
    }

    location /uploads {
        allow_methods GET POST;
        autoindex on;
    }
}

# Servidor 2: Porta secundária 8081 (Teste de Multi-porta)
server {
    listen 8081;
    host 127.0.0.1;
    server_name test.local;

    root ./www;
    index test.html;
    client_max_body_size 2M;

    location / {
        allow_methods GET;
        autoindex off;
    }
}

# Servidor 3: Mesma porta 8080, Host Virtual diferente (Teste de Deduplicação de Socket)
server {
    listen 8080;
    host 127.0.0.1;
    server_name virtual.local;

    root ./www/virtual;
    index index.html;

    location / {
        allow_methods GET;
    }
}