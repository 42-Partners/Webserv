# ==============================================================================
# Webserver Mock Configuration
# ==============================================================================

# Servidor 1: Porta 8080
server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost;

    client_max_body_size 10M;

    error_page 404 /404.html;

    location / {
        root ./www;
        index index.html;
        allow_methods GET POST;
    }
    
    location /upload {
        allow_methods POST;
        upload_path ./uploads;
    }
}

# Servidor 2: Porta 8081 (Teste Multi-porta)
server {
    listen 8081;
    host 127.0.0.1;
    server_name test.local;

    client_max_body_size 2M;

    location / {
        root ./www;
        index index.html;
        allow_methods GET POST;
    }
}

# Servidor 3: Porta 8080 (Virtual Host)
server {
    listen 8080;
    host 127.0.0.1;
    server_name virtual.local;

    location / {
        root ./www/virtual;
        index index.html;
    }
}
