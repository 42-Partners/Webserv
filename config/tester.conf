server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost;

    client_max_body_size 100M;

    # 1. / deve responder APENAS a GET
    location / {
        root ./www;
        index index.html;
        allow_methods GET;
    }

    # 2. /post_body aceita POST
    location /post_body {
        root ./www;
        allow_methods POST;
    }

    # 3. /directory/ aponta para YoupiBanane e busca youpi.bad_extension por padrão
    location /directory {
        root ./YoupiBanane;
        index youpi.bad_extension;
        allow_methods GET;
    }

    # 4. Qualquer requisição para .bla em POST executa CGI
    location .bla {
        root ./YoupiBanane;
        allow_methods POST;
        cgi_extension .bla;
    }
}