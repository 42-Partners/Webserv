server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost;

    client_max_body_size 100M;

    location / {
        root ./www;
        index index.html;
        allow_methods GET;
    }

    location /post_body {
        root ./www;
        allow_methods POST;
    }

    location /directory {
        root ./www/YoupiBanane;
        index youpi.bad_extension;
        allow_methods GET POST;
        cgi_extension .bla;
        # cgi_path ./tests/cgi_tester;
    }
}