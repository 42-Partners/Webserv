# ==============================================================================
# Config de teste para os scripts em tests/ (mesma sintaxe da config default)
#
# Diferenças propositais em relação à config default:
#   - NÃO existe "location /": assim GET / e GET /nothing dão 404 por falta de location
#   - client_max_body_size 1M: o teste de 413 manda 5MB (BIG_MB=5)
#   - locations de redirect (/old, /temp, /ext, /perm)
# Ajuste a sintaxe do "return" se a sua for diferente.
# ==============================================================================

server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost;

    client_max_body_size 1M;

    location /site {
        root ./www;
        index index.html;
        allow_methods GET;
    }

    location /upload {
        root ./www;
        allow_methods POST;
        upload_path ./uploads;
    }

    location /upload/any {
        root ./www;
        allow_methods GET POST DELETE;
        upload_path ./uploads;
    }

    location /delete {
        root ./www;
        allow_methods DELETE;
    }

    location /old { redirect 301 /site; }
    location /temp { redirect 302 /site; }
    location /ext { redirect 307 https://example.com; }
    location /perm { redirect 308 /site; }
}