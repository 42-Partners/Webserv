# ==============================================================================
# Config de teste para os scripts em tests/ (mesma sintaxe da config default)
#
# Diferenças propositais em relação à config default:
#   - NÃO existe "location /": assim GET / e GET /nothing dão 404 por falta de location
#   - client_max_body_size 1M: o teste de 413 manda 5MB (BIG_MB=5)
#   - locations de redirect (/old, /temp, /ext, /perm)
# Ajuste a sintaxe do "return" se a sua for diferente.
# ==============================================================================

server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost;

    root ./www;
    index index.html;
    client_max_body_size 1M;

    location /site {
        allow_methods GET;
    }

    location /upload {
        allow_methods POST;
    }

    location /upload/any {
        allow_methods GET POST DELETE;
    }

    location /delete {
        allow_methods DELETE;
    }

    location /old  { return 301 /site; }
    location /temp { return /site; }               # sem código -> 302
    location /ext  { return 307 https://example.com; }
    location /perm { return 308 /site; }
}